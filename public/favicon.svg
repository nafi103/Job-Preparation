<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Dark Rounded Container with High Contrast -->
  <rect width="64" height="64" rx="14" fill="#0d1117" />
  <!-- Neon Gradient Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#border-grad)" stroke-width="3" />
  
  <!-- Terminal Prompt ">" in Neon Green -->
  <path d="M16 19 L32 32 L16 45" stroke="#39FF14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Cursor "_" in Electric Blue -->
  <path d="M36 45 H50" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

  <defs>
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#BC13FE" />
      <stop offset="100%" stop-color="#39FF14" />
    </linearGradient>
  </defs>
</svg>